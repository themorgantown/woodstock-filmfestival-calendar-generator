name: Scrape Woodstock Calendar

on:
  schedule:
    # Run every 2 hours
    - cron: '47 */1 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Check cutoff date
        id: check-date
        run: |
          # Stop running after Oct 19, 2026 at 10pm EDT (Oct 20, 2026 02:00 UTC)
          CUTOFF_DATE="2026-10-20 02:00:00 UTC"
          CUTOFF_TIMESTAMP=$(date -d "$CUTOFF_DATE" +%s 2>/dev/null || date -j -f "%Y-%m-%d %H:%M:%S %Z" "$CUTOFF_DATE" +%s)
          CURRENT_TIMESTAMP=$(date +%s)

          if [ "$CURRENT_TIMESTAMP" -gt "$CUTOFF_TIMESTAMP" ]; then
            echo "Skipping run - past cutoff date (Oct 19, 2026 10pm EDT)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check-date.outputs.skip != 'true'
        uses: actions/checkout@v5.0.0

      - name: Set up Python
        if: steps.check-date.outputs.skip != 'true'
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        if: steps.check-date.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # requirements.txt pins no playwright version, so key the browser cache
      # on the version pip actually resolved - otherwise an upgraded playwright
      # restores a cache without the browser build it now expects.
      - name: Resolve Playwright version
        id: pw-version
        if: steps.check-date.outputs.skip != 'true'
        run: |
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        if: steps.check-date.outputs.skip != 'true'
        uses: actions/cache@v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      # Always run: a no-op download when the cache already holds this build,
      # and the safety net when it doesn't.
      - name: Install Playwright browsers
        if: steps.check-date.outputs.skip != 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Self-check parsing and sellout logic
        if: steps.check-date.outputs.skip != 'true'
        run: |
          python test_make_calendar.py

      - name: Run calendar scraper
        id: scrape
        if: steps.check-date.outputs.skip != 'true'
        run: |
          python make_calendar.py

      # Only runs when the scrape above succeeded - make_calendar.py exits
      # non-zero if it found no events, so a broken scrape never deploys.
      - name: Build static site
        if: steps.check-date.outputs.skip != 'true' && steps.scrape.outcome == 'success'
        run: |
          python build_site.py

      - name: Publish to Cloudflare
        if: steps.check-date.outputs.skip != 'true' && steps.scrape.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.2"
          command: deploy

      - name: Upload calendar artifact
        if: steps.check-date.outputs.skip != 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wff-calendar-${{ github.run_number }}
          path: |
            woodstockfilmfestival.ics
            wff_2026_complete.ics
            sellouts.csv
            wff_calendar_v2.log
          retention-days: 30

      - name: Commit and push changes
        if: steps.check-date.outputs.skip != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin main
          git add woodstockfilmfestival.ics wff_2026_complete.ics
          # Only exists once something has actually sold out
          if [ -f sellouts.csv ]; then git add sellouts.csv; fi
          git diff --staged --quiet || git commit -m "Update calendar data - $(TZ='America/New_York' date +'%Y-%m-%d %H:%M:%S %Z')"
          git push
        continue-on-error: true
